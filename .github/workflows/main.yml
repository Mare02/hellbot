name: Hellbot CI and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hellbot-production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.sha }}
  DEPLOY_RUN_ID: ${{ github.run_id }}
  DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install CI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: find src scripts -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Verify SQLite migrations
        env:
          HELLBOT_DATABASE_PATH: ${{ runner.temp }}/hellbot-ci-db
        run: pnpm run db:migrate

      - name: Build CI dashboard
        run: pnpm run dashboard:build

      - name: Configure VPS SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/configureDeploySsh.sh

      - name: Prepare production checkout
        run: bash scripts/deployRemote.sh prepare

      - name: Install production dependencies
        run: bash scripts/deployRemote.sh install

      - name: Build production dashboard
        run: bash scripts/deployRemote.sh build

      - name: Migrate production database
        run: bash scripts/deployRemote.sh migrate

      - name: Restart bot and dashboard
        run: bash scripts/deployRemote.sh restart

      - name: Verify production health and record release
        run: bash scripts/deployRemote.sh verify

      - name: Register slash commands
        run: bash scripts/deployRemote.sh register

  notify:
    name: Notify Discord
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure VPS SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/configureDeploySsh.sh

      - name: Announce deployment
        run: bash scripts/deployRemote.sh notify
