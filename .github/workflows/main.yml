name: Hellbot CI and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hellbot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Verify SQLite migrations
        env:
          HELLBOT_DATABASE_PATH: ${{ runner.temp }}/hellbot-ci-db
        run: pnpm run db:migrate

      - name: Build dashboard
        run: pnpm run dashboard:build

      - name: Configure VPS SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes hellbot@93.127.160.57 "bash -l -i -c 'exec bash -euo pipefail -s -- $DEPLOY_SHA'" <<'REMOTE'
            set -euo pipefail
            export NODE_ENV=production
            cd /home/hellbot/projects/hellbot
            test -z "$(git status --porcelain)"
            git fetch origin main
            git merge --ff-only "$1"
            test "$(git rev-parse HEAD)" = "$1"
            test "$(pnpm --version)" = '12.6.0'
            pnpm install --frozen-lockfile --prod=false
            pnpm run dashboard:build
            pnpm run db:migrate
            pm2 restart hellbot --update-env
            if pm2 describe hellbot-dashboard >/dev/null 2>&1; then
              pm2 restart hellbot-dashboard --update-env
            else
              pm2 start src/dashboard/server.js --name hellbot-dashboard --cwd "$PWD"
            fi
            pm2 save
            node scripts/checkDeployment.js
            node -e 'require("./src/commands/slashCommands/updateslashcommands").execute(null, true).catch(() => { console.error("Slash-command registration failed."); process.exitCode = 1; })'
            commit_message="$(git log -1 --format=%s)"
            COMMIT_MESSAGE="$commit_message" node scripts/announceDeployment.js
          REMOTE
